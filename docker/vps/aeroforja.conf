# infra/nginx/conf.d/aeroforja.conf  (docker-modular-infra)
#
# Protected with the same basic auth as the internal services until the open
# decision "uso personal o publicación" is closed. To make it public, delete
# the two auth_basic lines and reload nginx.

server {
    listen 80;
    server_name aeroforja.tenebrum.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name aeroforja.tenebrum.online;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        auth_basic "AeroForja";
        auth_basic_user_file /etc/nginx/certs/.htpasswd;

        proxy_pass         http://aeroforja:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
